version: "1.0.0"
resourceDefinitions: []
dataSourceDefinitions: []

linkDefinitions:
  # Link: ElastiCache replication group applies a Redis AUTH token from a Secrets Manager secret
  # The replication group (A) links to the secret (B) to source its AUTH token.
  # Semantics: "My ElastiCache replication group uses this secret as its Redis AUTH token"
  - resourceTypeA: aws/elasticache/replicationGroup
    resourceTypeB: aws/secretsmanager/secret
    kind: soft
    priorityResource: A
    summary: A link that applies a Redis AUTH token, stored in a Secrets Manager secret, to an ElastiCache replication group.
    annotations:
      resourceA:
        - name: aws.elasticache.secretsmanager.authTokenUpdateStrategy
          valueType: enum
          description: "The strategy ElastiCache uses when applying the AUTH token via ModifyReplicationGroup. ROTATE adds the new token while keeping the previous one valid for a rotation window. SET replaces the previous tokens with a single token and is only accepted by ElastiCache after a previous ROTATE, so it is rejected on first configuration. When unset, the link uses ROTATE for both first configuration and subsequent updates."
          allowedValues:
            - SET
            - ROTATE
      resourceB: []
    operations:
      updateResourceA:
        create:
          - ModifyReplicationGroup
        update:
          - ModifyReplicationGroup
        destroy: []
        notes: "Reads the secret value via GetSecretValue and applies it as the replication group's AUTH token via ModifyReplicationGroup. Does not remove the AUTH token on destroy."
      updateResourceB: {}
      updateIntermediaryResources: {}
    docLinks:
      - https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/auth.html
      - https://docs.aws.amazon.com/AmazonElastiCache/latest/APIReference/API_ModifyReplicationGroup.html
      - https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_GetSecretValue.html
    notes: |
      ElastiCache treats authToken as a write-only field with no computed output, and a Secrets
      Manager secret's generated value is never exposed as a computed attribute. As a result a
      generated AUTH token cannot be referenced from the secret into the replication group's
      authToken field through the blueprint. This hand-written link closes that gap:

      1. Reads the secret value at deploy time via Secrets Manager GetSecretValue, using the
         secret's primary identifier (its id, which is the secret ARN) as the secret id.

      2. Applies the value as the replication group's AUTH token via ElastiCache
         ModifyReplicationGroup, using AuthTokenUpdateStrategy ROTATE for both first
         configuration and subsequent updates (overridable via the authTokenUpdateStrategy
         annotation; SET is only accepted by ElastiCache after a previous ROTATE, so it is
         rejected on first configuration).

      The AUTH token value is never written into blueprint state or exposed as a computed field.

      Redis AUTH requires in-transit encryption; the replication group must set
      transitEncryptionEnabled to true, otherwise the link surfaces a validation diagnostic at
      blueprint validation time.
