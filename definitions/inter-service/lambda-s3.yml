version: "1.0.0"
resourceDefinitions: []
dataSourceDefinitions: []

linkDefinitions:
  # Lambda function with read/write access to an S3 bucket
  # The function (A) links to the bucket (B) to access objects.
  # Semantics: "My Lambda function needs to access this S3 bucket"
  - resourceTypeA: aws/lambda/function
    resourceTypeB: aws/s3/bucket
    kind: soft
    priorityResource: none
    summary: A link that grants a Lambda function read/write access to an S3 bucket.
    annotations:
      resourceA:
        - name: aws.lambda.s3.populateEnvVars
          valueType: boolean
          description: "When true, populates environment variables for all linked S3 buckets."
          default: true
        - name: aws.lambda.s3.<targetBucket>.populateEnvVars
          valueType: boolean
          description: "When true, populates environment variables for the specific target bucket. Overrides the global setting."
        - name: aws.lambda.s3.<targetBucket>.envVarName
          valueType: string
          description: "Custom environment variable name for the target bucket name. Defaults to an auto-generated name based on the bucket name."
        - name: aws.lambda.s3.<targetBucket>.accessLevel
          valueType: enum
          description: "The level of access to grant to the S3 bucket."
          default: readwrite
          allowedValues:
            - read
            - write
            - readwrite
      resourceB: []
    operations:
      updateResourceA:
        create:
          - UpdateFunctionConfiguration
        update:
          - UpdateFunctionConfiguration
        destroy:
          - UpdateFunctionConfiguration
      updateResourceB: {}
      updateIntermediaryResources:
        aws/iam/role:
          create:
            - PutRolePolicy
          update:
            - PutRolePolicy
          destroy:
            - DeleteRolePolicy
          config:
            intermediaryType: existing
            intermediaryExternalIdSource: resourceA.spec.role
    docLinks:
      - https://docs.aws.amazon.com/lambda/latest/dg/with-s3-example.html
      - https://docs.aws.amazon.com/AmazonS3/latest/userguide/security-iam.html
      - https://docs.aws.amazon.com/lambda/latest/dg/API_UpdateFunctionConfiguration.html
    notes: |
      This link configures the Lambda function to access the S3 bucket by:
      1. Optionally populating an environment variable with the bucket name (controlled by annotations)
      2. Adding an inline IAM policy to the function's execution role with S3 permissions

      The accessLevel annotation controls the permissions granted:
      - "read": s3:GetObject, s3:ListBucket (on the bucket and its objects)
      - "write": s3:PutObject, s3:DeleteObject
      - "readwrite" (default): Both read and write permissions

      The IAM role is an intermediary resource that must be defined in the same blueprint.
      The implementation sources the role from resourceA.spec.role.

      When the function runs inside a VPC without NAT egress, the link activates the S3
      gateway VPC endpoint (and the associated route-table/security-group access) on the
      linked aws/flex/vpc so the function can reach S3 over the private network. With NAT
      egress present this is a no-op. S3 (and DynamoDB) use gateway endpoints rather than
      interface endpoints.

      Buckets encrypted with a customer managed KMS key require the key policy to allow the
      function's execution role (kms:Decrypt, and kms:GenerateDataKey for writes); this is
      outside the link's control and should be surfaced in the link's rich description.
