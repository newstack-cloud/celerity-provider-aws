version: "1.0.0"
resourceDefinitions: []
dataSourceDefinitions: []

linkDefinitions:
  # S3 bucket notifies an SNS topic on object events
  # The bucket (A) selects the topic (B) via a link selector; the link wires the bucket's
  # notification configuration to publish to the topic and grants S3 permission to publish
  # to it.
  # Semantics: "Object events on this bucket are published to this SNS topic"
  #
  # This is the promoted, low-boilerplate way to wire bucket notifications: the author
  # selects the target by label and the link manages both the bucket notification entry
  # and the topic policy. The bucket's notificationConfiguration remains available for
  # manual configuration; this link merges its own entry and preserves any entries
  # declared inline or by other links.
  - resourceTypeA: aws/s3/bucket
    resourceTypeB: aws/sns/topic
    kind: soft
    priorityResource: A
    summary: A link that configures an S3 bucket to publish object event notifications to an SNS topic.
    annotations:
      resourceA: []
      resourceB:
        - name: aws.s3.sns.event.<index>
          valueType: enum
          description: "An S3 event type that publishes to the topic. <index> is the zero-based position in the event list; add multiple events with successive indices (0, 1, ...). Defaults to s3:ObjectCreated:* when none are specified."
          allowedValues:
            - "s3:ObjectCreated:*"
            - "s3:ObjectCreated:Put"
            - "s3:ObjectCreated:Post"
            - "s3:ObjectCreated:Copy"
            - "s3:ObjectCreated:CompleteMultipartUpload"
            - "s3:ObjectRemoved:*"
            - "s3:ObjectRemoved:Delete"
            - "s3:ObjectRemoved:DeleteMarkerCreated"
            - "s3:ObjectRestore:*"
            - "s3:ObjectRestore:Post"
            - "s3:ObjectRestore:Completed"
            - "s3:ReducedRedundancyLostObject"
            - "s3:Replication:*"
        - name: aws.s3.sns.filterPrefix
          valueType: string
          description: "Restricts notifications to objects whose key begins with this prefix."
        - name: aws.s3.sns.filterSuffix
          valueType: string
          description: "Restricts notifications to objects whose key ends with this suffix."
    operations:
      updateResourceA: {}
      updateResourceB: {}
      # The link performs all of its work in the intermediary phase, the only phase with
      # access to the resource service (for the bucket lock and the managed topic policy).
      # It first sets the topic policy, then merges this link's topic notification entry
      # into the bucket's notification configuration (PutBucketNotificationConfiguration)
      # under a bucket lock, preserving entries declared inline or by other links. The
      # topic policy is set before the notification entry is written because S3 validates
      # the destination permission when the notification configuration is applied.
      updateIntermediaryResources:
        # The topic policy allowing S3 to publish to the topic. The source bucket
        # (s3.amazonaws.com, SourceArn = resourceA.state.arn) is read by the link.
        # aws/sns/topicInlinePolicy is a Cloud Control resource (AWS::SNS::TopicInlinePolicy),
        # the SNS analogue of aws/sqs/queueInlinePolicy.
        aws/sns/topicInlinePolicy:
          create:
            - CreateResource
          update:
            - UpdateResource
          destroy:
            - DeleteResource
          config:
            intermediaryType: managed
            config:
              topicArn: resourceB.state.topicArn
    docLinks:
      - https://docs.aws.amazon.com/AmazonS3/latest/userguide/ways-to-add-notification-config-to-bucket.html
      - https://docs.aws.amazon.com/AmazonS3/latest/userguide/grant-destinations-permissions-to-s3.html
    notes: |
      This link configures an S3 bucket to publish object events to an SNS topic:

      1. Adds a managed resource-based policy on the topic granting `sns:Publish` to
         s3.amazonaws.com, scoped to the source bucket ARN, via a managed
         aws/sns/topicInlinePolicy intermediary.
      2. Merges a topic notification entry into the bucket's notification configuration
         (event types and key filters from the resourceB annotations above), preserving any
         entries declared inline on the bucket or by other links.

      The topic policy is set before the notification entry is written, since S3 validates
      the destination permission when the notification configuration is applied.

      Topics encrypted with a customer managed KMS key require the key policy to allow
      s3.amazonaws.com (kms:GenerateDataKey, kms:Decrypt); that is outside this link's
      control and is surfaced in the link's rich description.
