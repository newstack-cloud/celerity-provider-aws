version: "1.0.0"
resourceDefinitions: []
dataSourceDefinitions: []

linkDefinitions:
  # Lambda function with read (or read/write) access to a Secrets Manager secret.
  # The function (A) links to the secret (B) to read its value at runtime.
  # Semantics: "My Lambda function needs to read this secret".
  - resourceTypeA: aws/lambda/function
    resourceTypeB: aws/secretsmanager/secret
    kind: soft
    priorityResource: none
    summary: A link that grants a Lambda function access to a Secrets Manager secret.
    annotations:
      resourceA:
        - name: aws.lambda.secretsmanager.populateEnvVars
          valueType: boolean
          description: "When true, populates environment variables for all linked secrets."
          default: true
        - name: aws.lambda.secretsmanager.<targetSecret>.populateEnvVars
          valueType: boolean
          description: "When true, populates environment variables for the specific target secret. Overrides the global setting."
        - name: aws.lambda.secretsmanager.<targetSecret>.envVarName
          valueType: string
          description: "Custom environment variable name for the target secret ARN. Defaults to an auto-generated name based on the secret name."
        - name: aws.lambda.secretsmanager.<targetSecret>.accessLevel
          valueType: enum
          description: "The level of access to grant to the secret."
          default: read
          allowedValues:
            - read
            - write
            - readwrite
      resourceB: []
    operations:
      updateResourceA:
        create:
          - UpdateFunctionConfiguration
        update:
          - UpdateFunctionConfiguration
        destroy:
          - UpdateFunctionConfiguration
      updateResourceB: {}
      updateIntermediaryResources:
        aws/iam/role:
          create:
            - PutRolePolicy
          update:
            - PutRolePolicy
          destroy:
            - DeleteRolePolicy
          config:
            intermediaryType: existing
            intermediaryExternalIdSource: resourceA.spec.role
    docLinks:
      - https://docs.aws.amazon.com/secretsmanager/latest/userguide/retrieving-secrets_lambda.html
      - https://docs.aws.amazon.com/secretsmanager/latest/userguide/auth-and-access_identity-based-policies.html
      - https://docs.aws.amazon.com/lambda/latest/dg/API_UpdateFunctionConfiguration.html
    notes: |
      This link configures the Lambda function to access the Secrets Manager secret by:
      1. Optionally populating an environment variable with the secret ARN (controlled by annotations)
      2. Adding an inline IAM policy to the function's execution role with Secrets Manager permissions

      The accessLevel annotation controls the permissions granted:
      - "read" (default): secretsmanager:GetSecretValue, secretsmanager:DescribeSecret
      - "write": secretsmanager:PutSecretValue, secretsmanager:UpdateSecret
      - "readwrite": Both read and write permissions

      The IAM role is an intermediary resource that must be defined in the same blueprint.
      The implementation sources the role from resourceA.spec.role.

      When the function runs inside a VPC without NAT egress, the link activates the
      Secrets Manager interface VPC endpoint (com.amazonaws.<region>.secretsmanager) on the
      linked aws/flex/vpc so the function can reach Secrets Manager over the private network.
      With NAT egress present this is a no-op.

      Secrets encrypted with a customer managed KMS key also require kms:Decrypt on that key
      for the function's execution role. Link the function to the aws/kms/key as well (or grant
      it via the key policy); this is outside this link's control and is surfaced in the rich
      description.
