version: "1.0.0"
resourceDefinitions: []
dataSourceDefinitions: []

linkDefinitions:
  # Link 1: EventBridge rule delivers to an SQS queue
  # The rule (A) links to the queue (B) to grant SendMessage permission
  # Semantics: "This rule is allowed to send messages to this SQS queue"
  #
  # The rule -> queue wiring (the targets[] entry) and all per-target user input
  # (input/inputTransformer/sqsParameters.messageGroupId/retryPolicy/...) are
  # modelled inline on the aws/events/rule resource, referencing the queue via the
  # target entry arn. This link carries no user input - only the resource-based
  # queue policy side-effect.
  - resourceTypeA: aws/events/rule
    resourceTypeB: aws/sqs/queue
    kind: soft
    priorityResource: none
    summary: A link that grants an EventBridge rule permission to send messages to an SQS queue via the queue's resource-based policy.
    annotations:
      resourceA: []
      resourceB: []
    operations:
      updateResourceA: {}
      updateResourceB: {}
      updateIntermediaryResources:
        aws/sqs/queueInlinePolicy:
          create:
            - SetQueueAttributes
          update:
            - SetQueueAttributes
          destroy:
            - SetQueueAttributes
          config:
            intermediaryType: managed
            config:
              queue: resourceB.state.queueUrl
    docLinks:
      - https://docs.aws.amazon.com/AWSSimpleQueueService/latest/APIReference/API_SetQueueAttributes.html
      - https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-use-resource-based.html
    notes: |
      For SQS targets, EventBridge relies on the queue's resource-based policy.

      The rule -> queue wiring itself (the targets[] entry), the FIFO messageGroupId
      (sqsParameters.messageGroupId) and all other per-target input are modelled
      inline on the aws/events/rule resource (referencing the queue via the target
      entry arn), not by this link.

      SQS queues encrypted with a customer managed KMS key require the key policy
      to allow events.amazonaws.com (kms:GenerateDataKey, kms:Decrypt); this is
      outside the link's control and should be surfaced in the link's rich
      description.
