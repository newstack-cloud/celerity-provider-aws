version: "1.0.0"
resourceDefinitions: []
dataSourceDefinitions: []

linkDefinitions:
  - resourceTypeA: aws/sqs/queue
    resourceTypeB: aws/sqs/queue
    kind: soft
    cardinalityA:
      max: 1
    priorityResource: none
    summary: A link that configures the linked to queue as the dead-letter queue for the linked from queue.
    annotations:
      resourceA:
        - name: aws.sqs.redrive.maxReceiveCount
          valueType: integer
          description: "The number of times a message is received before being sent to the dead-letter queue."
          required: true
          min: 1
          max: 1000
      resourceB: []
    operations:
      updateResourceA:
        create:
          - SetQueueAttributes
        update:
          - SetQueueAttributes
        destroy:
          - SetQueueAttributes
      updateResourceB: {}
      updateIntermediaryResources: {}
    docLinks:
      - https://docs.aws.amazon.com/AWSSimpleQueueService/latest/APIReference/API_SetQueueAttributes.html