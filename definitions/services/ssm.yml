version: "1.0.0"
resourceDefinitions:
  - type: aws/ssm/parameter
    label: AWS SSM Parameter
    requiredFields:
      - name
      - type
    computedFields:
      - arn
      - version
    operations:
      create:
        # PutParameter creates the parameter (with tags, since Overwrite is false);
        # GetParameter reads back the ARN which PutParameter does not return.
        - PutParameter
        - GetParameter
      update:
        # PutParameter overwrites value/metadata; tags are reconciled separately since
        # they cannot be sent alongside an overwriting PutParameter.
        - PutParameter
        - ListTagsForResource
        - AddTagsToResource
        - RemoveTagsFromResource
        - GetParameter
      destroy:
        - DeleteParameter
      getExternalState:
        - GetParameter
        - DescribeParameters
        - ListTagsForResource
      # No stabilisation operations: PutParameter provisions synchronously and returns
      # the version immediately, so the parameter is stable as soon as it is created.
      stabilised: []
    tags:
      saveTags: AddTagsToResource
      removeTags: RemoveTagsFromResource
    docLinks:
      - https://docs.aws.amazon.com/systems-manager/latest/APIReference/API_PutParameter.html
      - https://docs.aws.amazon.com/systems-manager/latest/APIReference/API_GetParameter.html
      - https://docs.aws.amazon.com/systems-manager/latest/APIReference/API_DeleteParameter.html
      - https://docs.aws.amazon.com/systems-manager/latest/APIReference/API_DescribeParameters.html
      - https://docs.aws.amazon.com/systems-manager/latest/APIReference/API_AddTagsToResource.html
      - https://docs.aws.amazon.com/systems-manager/latest/APIReference/API_RemoveTagsFromResource.html
    propertyDocLinks:
      type: https://docs.aws.amazon.com/systems-manager/latest/userguide/sysman-paramstore-su-create.html
      secureValue: https://docs.aws.amazon.com/systems-manager/latest/userguide/sysman-paramstore-securestring.html
      keyId: https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html#key-id
      tier: https://docs.aws.amazon.com/systems-manager/latest/userguide/parameter-store-advanced-parameters.html
      policies: https://docs.aws.amazon.com/systems-manager/latest/userguide/parameter-store-policies.html
      allowedPattern: https://docs.aws.amazon.com/systems-manager/latest/userguide/sysman-paramstore-su-create.html
    notes: |
      aws/ssm/parameter is a hand-written resource (implemented directly against the SSM SDK,
      like aws/flex/vpc) rather than a Cloud Control-backed generated resource. CloudFormation
      (and therefore Cloud Control) cannot create SecureString parameters, AWS::SSM::Parameter
      only allows the String and StringList types, SecureString is essential to low-cost
      configuration management as an alternative to Secrets Manager.

      Value handling:
      - String / StringList parameters set their plaintext value via the "value" field, which is
        visible in diffs and logs.
      - SecureString parameters set their value via the "secureValue" field, which is marked
        sensitive (redacted from diffs and logs) and encrypted at rest by KMS. When "keyId" is
        omitted, the AWS-managed alias/aws/ssm key is used.

      Exactly one of "value" / "secureValue" must be set, consistent with "type". Drift on
      "keyId" and "policies" is ignored: AWS resolves the default key and returns policies as
      structured metadata that does not round-trip byte-for-byte to the submitted JSON.

      Cross-region replication:
      - Parameter Store has no built-in cross-region replication, so replicas are provisioned
        as separate aws/ssm/parameter resources that each set the optional "region" field.
      - When "region" is set, all lifecycle operations (create, update, destroy, drift checks)
        target that region instead of the provider-configured region. Changing the region
        replaces the parameter.
      - Drift on "region" is ignored: when the field is unset, the provider-level region is
        applied and reported back in external state, which would otherwise read as drift.

  - type: aws/ssm/parameterPath
    label: AWS SSM Parameter Path
    requiredFields:
      - path
    computedFields: []
    operations:
      # Synthetic resource: no AWS API object exists for a parameter hierarchy itself,
      # so every lifecycle phase is a no-op against AWS.
      create: []
      update: []
      destroy: []
      getExternalState: []
      stabilised: []
    docLinks:
      - https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-parameter-store-hierarchies.html
    propertyDocLinks:
      path: https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-parameter-store-hierarchies.html
    notes: |
      aws/ssm/parameterPath is a synthetic Bluelink resource with no AWS API object behind
      it. It represents an SSM parameter hierarchy (a path prefix such as "/my-app/config")
      as a whole, so that links can grant IAM access and inject configuration for the
      entire namespace rather than per parameter. Individual aws/ssm/parameter resources
      live beneath the path (e.g. "/my-app/config/db-host").

      The primary consumer is the aws/lambda/function::aws/ssm/parameterPath link, which
      grants ssm:GetParametersByPath over the prefix and injects the prefix as a single
      environment variable, regardless of how many parameters live beneath it.

dataSourceDefinitions:
  - type: aws/ssm/parameter
    filterableFields:
      - name
      - region
    docLinks:
      - https://docs.aws.amazon.com/systems-manager/latest/APIReference/API_GetParameter.html
      - https://docs.aws.amazon.com/systems-manager/latest/APIReference/API_DescribeParameters.html
    notes: |
      Looks up an existing SSM parameter by name. SecureString values are never returned by the
      data source (only plaintext String / StringList values populate the "value" export).

linkDefinitions: []
