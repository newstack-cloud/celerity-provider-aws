version: "1.0.0"
resourceDefinitions:
  - type: aws/ssm/parameter
    label: AWS SSM Parameter
    requiredFields:
      - name
      - type
    computedFields:
      - arn
      - version
    operations:
      create:
        # PutParameter creates the parameter (with tags, since Overwrite is false);
        # GetParameter reads back the ARN which PutParameter does not return.
        - PutParameter
        - GetParameter
      update:
        # PutParameter overwrites value/metadata; tags are reconciled separately since
        # they cannot be sent alongside an overwriting PutParameter.
        - PutParameter
        - ListTagsForResource
        - AddTagsToResource
        - RemoveTagsFromResource
        - GetParameter
      destroy:
        - DeleteParameter
      getExternalState:
        - GetParameter
        - DescribeParameters
        - ListTagsForResource
      # No stabilisation operations: PutParameter provisions synchronously and returns
      # the version immediately, so the parameter is stable as soon as it is created.
      stabilised: []
    tags:
      saveTags: AddTagsToResource
      removeTags: RemoveTagsFromResource
    docLinks:
      - https://docs.aws.amazon.com/systems-manager/latest/APIReference/API_PutParameter.html
      - https://docs.aws.amazon.com/systems-manager/latest/APIReference/API_GetParameter.html
      - https://docs.aws.amazon.com/systems-manager/latest/APIReference/API_DeleteParameter.html
      - https://docs.aws.amazon.com/systems-manager/latest/APIReference/API_DescribeParameters.html
      - https://docs.aws.amazon.com/systems-manager/latest/APIReference/API_AddTagsToResource.html
      - https://docs.aws.amazon.com/systems-manager/latest/APIReference/API_RemoveTagsFromResource.html
    propertyDocLinks:
      type: https://docs.aws.amazon.com/systems-manager/latest/userguide/sysman-paramstore-su-create.html
      secureValue: https://docs.aws.amazon.com/systems-manager/latest/userguide/sysman-paramstore-securestring.html
      keyId: https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html#key-id
      tier: https://docs.aws.amazon.com/systems-manager/latest/userguide/parameter-store-advanced-parameters.html
      policies: https://docs.aws.amazon.com/systems-manager/latest/userguide/parameter-store-policies.html
      allowedPattern: https://docs.aws.amazon.com/systems-manager/latest/userguide/sysman-paramstore-su-create.html
    notes: |
      aws/ssm/parameter is a hand-written resource (implemented directly against the SSM SDK,
      like aws/flex/vpc) rather than a Cloud Control-backed generated resource. CloudFormation
      (and therefore Cloud Control) cannot create SecureString parameters, AWS::SSM::Parameter
      only allows the String and StringList types, SecureString is essential to low-cost
      configuration management as an alternative to Secrets Manager.

      Value handling:
      - String / StringList parameters set their plaintext value via the "value" field, which is
        visible in diffs and logs.
      - SecureString parameters set their value via the "secureValue" field, which is marked
        sensitive (redacted from diffs and logs) and encrypted at rest by KMS. When "keyId" is
        omitted, the AWS-managed alias/aws/ssm key is used.

      Exactly one of "value" / "secureValue" must be set, consistent with "type". Drift on
      "keyId" and "policies" is ignored: AWS resolves the default key and returns policies as
      structured metadata that does not round-trip byte-for-byte to the submitted JSON.

      Cross-region replication:
      - Parameter Store has no built-in cross-region replication, so replicas are provisioned
        as separate aws/ssm/parameter resources that each set the optional "region" field.
      - When "region" is set, all lifecycle operations (create, update, destroy, drift checks)
        target that region instead of the provider-configured region. Changing the region
        replaces the parameter.
      - Drift on "region" is ignored: when the field is unset, the provider-level region is
        applied and reported back in external state, which would otherwise read as drift.

  - type: aws/ssm/parameterPath
    label: AWS SSM Parameter Path
    requiredFields:
      - path
    computedFields: []
    operations:
      # Synthetic resource: no AWS API object exists for a parameter hierarchy itself,
      # so every lifecycle phase is a no-op against AWS.
      create: []
      update: []
      destroy: []
      getExternalState: []
      stabilised: []
    docLinks:
      - https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-parameter-store-hierarchies.html
    propertyDocLinks:
      path: https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-parameter-store-hierarchies.html
    notes: |
      aws/ssm/parameterPath is a synthetic Bluelink resource with no AWS API object behind
      it. It represents an SSM parameter hierarchy (a path prefix such as "/my-app/config")
      as a whole, so that links can grant IAM access and inject configuration for the
      entire namespace rather than per parameter. Individual aws/ssm/parameter resources
      live beneath the path (e.g. "/my-app/config/db-host").

      The primary consumer is the aws/lambda/function::aws/ssm/parameterPath link, which
      grants ssm:GetParametersByPath over the prefix and injects the prefix as a single
      environment variable, regardless of how many parameters live beneath it.

  - type: aws/ssm/parameterTree
    label: AWS SSM Parameter Tree
    requiredFields:
      - path
    computedFields:
      - parameters
    operations:
      create:
        # One PutParameter per entry (with tags, since Overwrite is false). On a
        # ParameterAlreadyExists conflict the existing value is preserved and only tags
        # are synced (ListTags/AddTags/RemoveTags). DescribeParameters reads back the
        # per-entry structural metadata (ARN, type) that PutParameter does not return.
        - PutParameter
        - ListTagsForResource
        - AddTagsToResource
        - RemoveTagsFromResource
        - DescribeParameters
      update:
        # PutParameter re-puts only entries whose blueprint value changed (hash diff vs
        # the last applied state); DeleteParameter removes entries dropped from the spec.
        # GetParameter is used only on a keyId/tier/description change, to transiently
        # fetch and preserve the current cloud value of unchanged entries (a re-put
        # requires a value, and sending the blueprint value would clobber runtime
        # overrides); the fetched value is never stored or reported.
        - PutParameter
        - GetParameter
        - DeleteParameter
        - ListTagsForResource
        - AddTagsToResource
        - RemoveTagsFromResource
        - DescribeParameters
      destroy:
        - DeleteParameter
      getExternalState:
        # Structural metadata only: DescribeParameters returns no parameter values by
        # design, and GetParameter is never called, so stored values are never read back.
        - DescribeParameters
        - ListTagsForResource
      # No stabilisation operations: PutParameter provisions synchronously, so the tree
      # is stable as soon as its parameters are created.
      stabilised: []
    tags:
      saveTags: AddTagsToResource
      removeTags: RemoveTagsFromResource
    docLinks:
      - https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-parameter-store-hierarchies.html
      - https://docs.aws.amazon.com/systems-manager/latest/APIReference/API_PutParameter.html
      - https://docs.aws.amazon.com/systems-manager/latest/APIReference/API_DeleteParameter.html
      - https://docs.aws.amazon.com/systems-manager/latest/APIReference/API_DescribeParameters.html
    propertyDocLinks:
      path: https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-parameter-store-hierarchies.html
      secureValues: https://docs.aws.amazon.com/systems-manager/latest/userguide/sysman-paramstore-securestring.html
      keyId: https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html#key-id
      tier: https://docs.aws.amazon.com/systems-manager/latest/userguide/parameter-store-advanced-parameters.html
    notes: |
      aws/ssm/parameterTree is a hand-written resource that manages every parameter beneath
      a path prefix as a single store: one String parameter per entry in "values" and one
      SecureString parameter per entry in "secureValues", each at "<path>/<key>".

      Drift semantics (write-only blob posture):
      - "values" and "secureValues" are marked IgnoreDrift, and GetExternalState never reads
        parameter values back (no GetParameter, no decryption; DescribeParameters returns
        metadata only). Stored values therefore behave like Secrets Manager's secretString:
        applied on create and on explicit blueprint change, but never reported or reverted
        as drift. Out-of-band writes (runtime configuration updates via a CLI or console)
        survive redeploys, and out-of-band entry deletion is likewise invisible to drift by
        design. Use aws/ssm/parameter for individual parameters whose values should stay
        drift-tracked.
      - Update diffs against the last applied state, never against the cloud: a per-entry
        SHA-256 hash of the applied value is recorded in the computed "parameters" map, and
        an entry is re-put only when its desired hash differs (or it is new / moved between
        "values" and "secureValues"). The hash is a fingerprint of the value in state;
        state already persists resolved sensitive spec values, so this adds no new
        exposure, but low-entropy secrets are dictionary-attackable from a state leak.
      - On a create conflict (parameter already exists at "<path>/<key>") the existing
        value is preserved and only tags are synced, so pre-existing user-set values are
        never overwritten.
      - Parameters beneath the prefix that are not entries in the spec are foreign: they
        are never updated, deleted, or reported.

      Entry keys:
      - Keys are one or more segments of [a-zA-Z0-9_.-] separated by forward slashes (no
        leading/trailing slash), enabling structural namespacing within the store (for
        example "db/host"). The path levels plus key segments must fit SSM's 15-level
        maximum for a parameter name.
      - A key cannot appear in both "values" and "secureValues", and the tree must have at
        least one entry.

      "keyId", "tier", "description", and "tags" are shared by every parameter in the tree.
      The optional "region" field re-targets all lifecycle operations, mirroring
      aws/ssm/parameter's replication approach.

      The primary consumer is the aws/lambda/function::aws/ssm/parameterTree link, which
      grants access over the prefix and injects it as a single environment variable using
      the same SSM_PARAMETER_PATH_<name> convention as the parameterPath link.

dataSourceDefinitions:
  - type: aws/ssm/parameter
    filterableFields:
      - name
      - region
    docLinks:
      - https://docs.aws.amazon.com/systems-manager/latest/APIReference/API_GetParameter.html
      - https://docs.aws.amazon.com/systems-manager/latest/APIReference/API_DescribeParameters.html
    notes: |
      Looks up an existing SSM parameter by name. SecureString values are never returned by the
      data source (only plaintext String / StringList values populate the "value" export).

linkDefinitions: []
