version: "1.0.0"
resourceDefinitions: []
dataSourceDefinitions: []

linkDefinitions:
  # An EventBridge rule may invoke an API destination
  # The rule (A) links to the API destination (B) to grant invoke permission
  # Semantics: "This rule is allowed to invoke this API destination"
  - resourceTypeA: aws/events/rule
    resourceTypeB: aws/events/apiDestination
    kind: soft
    priorityResource: none
    summary: A link that grants an EventBridge rule permission to invoke an API destination by populating the IAM role referenced by the rule's matching target entry.
    annotations:
      resourceA: []
      resourceB: []
    operations:
      updateResourceA: {}
      updateResourceB: {}
      updateIntermediaryResources:
        aws/iam/role:
          create:
            - PutRolePolicy
          update:
            - PutRolePolicy
          destroy:
            - DeleteRolePolicy
          config:
            intermediaryType: existing
            intermediaryExternalIdSource: resourceA.spec.targets[].roleArn
    docLinks:
      - https://docs.aws.amazon.com/eventbridge/latest/APIReference/API_PutRule.html
      - https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-api-destinations.html
      - https://docs.aws.amazon.com/IAM/latest/APIReference/API_PutRolePolicy.html
    notes: |
      This link carries no user input. It "activates" the existing IAM role that
      EventBridge assumes to invoke the API destination: the link scans the rule's
      targets[] for the entry whose arn matches the destination (resourceB.state.arn)
      and sources the role from that entry's roleArn
      (intermediaryExternalIdSource: resourceA.spec.targets[].roleArn). It grants
      events:InvokeApiDestination on the destination and removes that statement when
      the link is destroyed. The role is a minimal placeholder the practitioner
      defines as a top-level blueprint resource; the link mirrors the
      lambda -> dynamodb access link.

      Statements are packed into the role's shared, allocator-managed inline policy
      ("bluelink-link-access") and overflow into attached managed policies when the
      inline policy is full, so the operations above (PutRolePolicy / DeleteRolePolicy)
      may also include CreatePolicy / CreatePolicyVersion / AttachRolePolicy /
      DetachRolePolicy / DeletePolicy on heavily-shared roles.

      The rule -> destination wiring itself is modelled inline in the rule's targets[]
      array and owned by the aws/events/rule resource (which references the API
      destination via the target entry's arn), not by this link. The role is shared
      across a rule's API destinations and accumulates one InvokeApiDestination
      statement per destination it is used for.
