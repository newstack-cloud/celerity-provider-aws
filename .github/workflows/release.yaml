# Bluelink Plugin release workflow.
# Combines release-please (PR management, tagging, draft release creation)
# with goreleaser (artifact building, signing, publishing).
#
# This must be a single workflow because tags created by the default
# GITHUB_TOKEN in GitHub Actions do not trigger other workflows.
#
# Flow:
# 1. release-please maintains a release PR based on conventional commits
# 2. When the release PR is merged, release-please creates a tag and draft release
# 3. goreleaser builds artifacts and uploads them to the draft release
# 4. The draft release is published, firing the "published" event
# 5. The Bluelink Registry webhook picks up the published event with all artifacts available
#
# Manual dispatch:
# The goreleaser job can be triggered manually via workflow_dispatch with a
# version input (e.g. "0.2.1"). This is useful for retrying a failed release
# without going through release-please again. The tag and draft release must
# already exist.
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (without v prefix, e.g. 0.2.1). Tag and draft release must already exist.'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Allow goreleaser to access older tag information.
          fetch-depth: 0
      - name: Checkout release tag
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: git checkout "${{ needs.release-please.outputs.tag_name }}"
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Resolve Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${{ needs.release-please.outputs.tag_name }}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Plugin Docgen Tool
        run: |
          go install github.com/newstack-cloud/bluelink/tools/plugin-docgen/cmd/bluelink-plugin-docgen@latest
      - name: Build Provider for Docgen
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p /tmp/bluelink/plugins/providers/newstack-cloud/aws/$VERSION
          go build -ldflags "-X main.version=$VERSION" -o /tmp/bluelink/plugins/providers/newstack-cloud/aws/$VERSION/plugin .
      - name: Generate Plugin JSON Docs
        run: |
          bluelink-plugin-docgen -plugin=newstack-cloud/aws
        env:
          BLUELINK_PLUGIN_DOCGEN_PLUGIN_LOG_FILE_ROOT_DIR: /tmp/bluelink/plugins/logs
          BLUELINK_DEPLOY_ENGINE_PLUGIN_PATH: /tmp/bluelink/plugins
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
      - name: Publish Draft Release
        run: gh release edit "${{ steps.version.outputs.tag }}" --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
