# Bluelink Plugin release workflow.
# Combines release-please (PR management, tagging, draft release creation)
# with goreleaser (artifact building, signing, publishing).
#
# This must be a single workflow because tags created by the default
# GITHUB_TOKEN in GitHub Actions do not trigger other workflows.
#
# Flow:
# 1. release-please maintains a release PR based on conventional commits
# 2. When the release PR is merged, release-please creates a tag and draft release
# 3. goreleaser builds artifacts and uploads them to the draft release
# 4. The draft release is published, firing the "published" event
# 5. The Bluelink Registry webhook picks up the published event with all artifacts available
name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Allow goreleaser to access older tag information.
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Install Plugin Docgen Tool
        run: |
          go install github.com/newstack-cloud/bluelink/tools/plugin-docgen/cmd/bluelink-plugin-docgen@latest
      - name: Build Provider for Docgen
        run: |
          VERSION=$(grep -o 'PluginVersion: *"[^"]*"' main.go | sed 's/PluginVersion: *"\(.*\)"/\1/')
          mkdir -p /tmp/bluelink/plugins/providers/newstack-cloud/aws/$VERSION
          go build -o /tmp/bluelink/plugins/providers/newstack-cloud/aws/$VERSION/plugin main.go
      - name: Generate Plugin JSON Docs
        run: |
          bluelink-plugin-docgen -plugin=newstack-cloud/aws
        env:
          BLUELINK_PLUGIN_DOCGEN_PLUGIN_LOG_FILE_ROOT_DIR: /tmp/bluelink/plugins/logs
          BLUELINK_DEPLOY_ENGINE_PLUGIN_PATH: /tmp/bluelink/plugins
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
      - name: Publish Draft Release
        run: gh release edit "${{ needs.release-please.outputs.tag_name }}" --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
