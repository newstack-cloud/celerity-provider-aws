# Bluelink Plugin release workflow.
name: Release

# This GitHub action creates a release when a tag that matches the pattern
# "v*" (e.g. v0.1.0) is created.
on:
  push:
    tags:
      - 'v*'

# Releases need permissions to read and write the repository contents.
# GitHub considers creating releases and uploading assets as writing contents.
permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          # Allow goreleaser to access older tag information.
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Install Plugin Docgen Tool
        run: |
          go install github.com/newstack-cloud/bluelink/tools/plugin-docgen/cmd/bluelink-plugin-docgen@latest
      - name: Build Provider for Docgen
        run: |
          VERSION=$(grep -o 'PluginVersion: *"[^"]*"' main.go | sed 's/PluginVersion: *"\(.*\)"/\1/')
          mkdir -p /tmp/bluelink/plugins/providers/newstack-cloud/aws/$VERSION
          go build -o /tmp/bluelink/plugins/providers/newstack-cloud/aws/$VERSION/plugin main.go
      - name: Generate Plugin JSON Docs
        run: |
          bluelink-plugin-docgen -plugin=newstack-cloud/aws
        env:
          BLUELINK_PLUGIN_DOCGEN_PLUGIN_LOG_FILE_ROOT_DIR: /tmp/bluelink/plugins/logs
          BLUELINK_DEPLOY_ENGINE_PLUGIN_PATH: /tmp/bluelink/plugins
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          # GitHub sets the GITHUB_TOKEN secret automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
      - name: Publish Draft Release
        run: gh release edit "${{ github.ref_name }}" --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}