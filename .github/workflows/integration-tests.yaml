name: Bluelink Provider for AWS Integration Tests

on:
  schedule:
    # Run once a week on Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs: {}

permissions:
  id-token: write
  contents: read

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Configure AWS Credentials for Integration Tests
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          aws-region: eu-west-2
          role-to-assume: arn:aws:iam::027653366630:role/github-actions-integration-tests
      - name: Run Integration Tests
        run: bash scripts/run-tests.sh --integration